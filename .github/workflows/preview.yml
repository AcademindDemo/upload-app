name: Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency: preview-${{ github.event.number }}

permissions:
  contents: read

env:
  STAGE: pr-${{ github.event.number }}

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAX_UPLOAD_BYTES: ${{ secrets.MAX_UPLOAD_BYTES }}
      WEBHOOK_KEY: ${{ secrets.WEBHOOK_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm alchemy deploy --stage $STAGE --yes

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.3
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm alchemy destroy --stage $STAGE --yes
